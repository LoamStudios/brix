[tools]
erlang = "29.0.6"
elixir = "1.20.4-otp-29"
hk = "1.57.0"

# =============================================================================
# Code quality
# =============================================================================

[tasks.fix]
run = "hk fix"
description = "Format and auto-fix (changed files)"

[tasks."fix:all"]
run = "hk fix --all"
description = "Format and auto-fix the whole repository"

[tasks.check]
run = "hk check"
description = "Format check, compile with warnings as errors, credo strict"

[tasks.test]
run = "mix test"
description = "Run tests"

[tasks.precommit]
depends = ["check", "test"]
description = "Run all checks and the test suite"

[tasks.signoff]
depends = ["precommit"]
run = "gh signoff test"
description = "Run all checks and sign off"
