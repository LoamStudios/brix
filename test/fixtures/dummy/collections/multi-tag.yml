name: Multi Tag
description: Posts with any of several tags
filter_groups:
  - logic: and
    conditions:
      - type: tag
        value:
          - coffee
          - brewing
      - type: prefix
        value: /blog/
  - logic: and
    conditions:
      - type: published_after
        value: "2024-01-01"
group_logic: or
sort_by: title
sort_direction: asc
